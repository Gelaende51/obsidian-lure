# Releases Lure: its tests on both Obsidian versions, then obsidian-toolkit's
# release workflow — the directory's preview scan, the release commit
# (changelogs and version files, then the CHANGELOG translation stamps that
# name it), the tag, the build with a signed provenance attestation on each
# asset, the GitHub release, and the directory's release scan, listing and
# recorded review. Anyone can check the bundle came from this repository at
# that commit:
#
#   gh attestation verify main.js --repo Gelaende51/obsidian-lure --signer-repo Gelaende51/obsidian-toolkit
#
# (Since 1.6.2 obsidian-toolkit's reusable workflow builds and signs, so it is
# the signer; releases up to 1.6.1 verify without --signer-repo.)
#
# Two ways in:
# - Actions → Release → Run workflow with a version (or `.dev/release.sh
#   1.6.2`). Translating the entries and refreshing the usage figures come
#   first, on the maintainer's machine; the run stops if a translation is
#   missing.
# - Pushing a tag by hand: tested, built and published as it is.
#
# Obsidian's installer reads manifest.json on the default branch and then
# looks for a release tagged with exactly that version — no "v" prefix — so the
# tag filter stays strict: an automated build's x.y.z-deps.n tag never starts
# a release.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.6.2 (no v)"
        required: true

permissions:
  contents: write
  # Required for the attestation to be signed; nothing else uses it.
  id-token: write
  attestations: write

jobs:
  # The whole suite, on both Obsidian versions, before anything is written.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    uses: Gelaende51/obsidian-toolkit/.github/workflows/release.yml@v0.13.2
    # The directory's session (OBSIDIAN_COMMUNITY_COOKIE), when it is set.
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      name: Lure
      # A stamp names the English commit a translation reflects, so it can only
      # be written once the release commit exists.
      after-commit: npm run -s stamp -- --freshness --only CHANGELOG
