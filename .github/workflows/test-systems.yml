# The suites on systems GitHub has no runner for, on demand only:
#
# - distros: other Linux distributions, as containers on the Linux runner;
# - old-engine: today's Obsidian on its oldest installer that still runs it
#   (Electron 21, Chromium 106) — the engine Windows 7, 8 and 8.1 are left
#   with, since newer Electron dropped them — on Linux, where no old Windows
#   is needed to ask it;
# - server-2019: Windows Server 2019 (the Windows 10 1809 code base) in a
#   virtual machine on the Linux runner (dockur/windows over KVM), installed
#   from Microsoft's own 180-day evaluation image on every run;
# - linux-arm: the Arm64 AppImage on GitHub's Arm Linux runner;
# - emulated: the x64 build where the machine is Arm — Windows 11 on Arm's
#   emulation, Rosetta on Apple silicon;
# - system-electron, flatpak, snap: Obsidian as Arch packages it (on the
#   system's Electron), from Flathub, from the Snap store — each its own
#   Electron and, for Flatpak, its own sandbox;
# - wine, freebsd: the Windows build under Wine, and Obsidian's app on
#   FreeBSD's own Electron in a FreeBSD VM. Experimental: they may not start.
#
# The last five start Obsidian through .dev/ci-launch-alt.mjs (OBSIDIAN_COMMAND).
#
# Actions → Test other systems → Run workflow, or
#   gh workflow run test-systems.yml -f target=distros -f suites="test-tab"
name: Test other systems

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run on"
        type: choice
        options: [distros, old-engine, server-2019, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits, wayland, nix, alpine, peer-residue, freeze-probe, all]
        default: distros
      suites:
        description: "Suites, space separated"
        default: "test-html test-tab test-links"
      obsidian:
        description: "Obsidian versions"
        type: choice
        options: [both, latest, earliest]
        default: both

permissions:
  contents: read

env:
  VERSIONS: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

jobs:
  distros:
    if: inputs.target == 'distros' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:20.04", "fedora:42", "archlinux:latest", "opensuse/leap:16.0"]
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g
    name: ${{ matrix.image }}
    steps:
      # Checkout unpacks with tar, which the smallest images (openSUSE Leap)
      # leave out.
      - name: tar, for the checkout
        run: |
          # An image that declares no PATH of its own (openSUSE) is left with
          # only the tool cache once setup-node adds to it: no /usr/bin, no sh.
          echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"
          command -v tar >/dev/null && exit 0
          if command -v zypper >/dev/null; then zypper --non-interactive --gpg-auto-import-keys refresh && zypper --non-interactive install bash-sh tar gzip
          elif command -v dnf >/dev/null; then dnf install -y tar gzip
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm tar gzip
          else apt-get update -q && apt-get install -y -q tar gzip; fi
      - uses: actions/checkout@v4
      - name: System packages
        run: sh .dev/ci-distro-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          # Root in a container: Electron's sandbox will not start as root.
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: |
          set +e
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          failed=0
          for version in $VERSIONS; do
            for suite in $SUITES; do
              echo "::group::$suite (Obsidian $version)"
              OBSIDIAN_VERSION=$version .dev/ci-run.sh "$suite"; code=$?
              echo "::endgroup::"
              case $code in 0) ;; 2) echo "::warning::$suite ($version) skipped cases" ;; *) echo "::error::$suite ($version) failed"; failed=1 ;; esac
            done
          done
          exit $failed

  old-engine:
    if: inputs.target == 'old-engine' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites on installer 1.1.16 (Electron 21)
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          OBSIDIAN_INSTALLER: "1.1.16"
          SUITES: ${{ inputs.suites }}
        run: |
          set +e
          failed=0
          for version in $VERSIONS; do
            for suite in $SUITES; do
              echo "::group::$suite (Obsidian $version, installer 1.1.16)"
              OBSIDIAN_VERSION=$version xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh "$suite"; code=$?
              echo "::endgroup::"
              case $code in 0) ;; 2) echo "::warning::$suite ($version) skipped cases" ;; *) echo "::error::$suite ($version) failed"; failed=1 ;; esac
            done
          done
          exit $failed

  linux-arm:
    if: inputs.target == 'linux-arm' || inputs.target == 'all'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libfuse2t64 || sudo apt-get install -y -q xvfb libfuse2
      - name: Run the suites
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # Node is installed as x64, so the launcher fetches the x64 build and the
  # machine emulates it. The first suite says which architecture Obsidian ran.
  emulated:
    if: inputs.target == 'emulated' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    name: x64 emulated on ${{ matrix.os }}
    # Rosetta is a probe: test-tab passes on macOS natively and on Windows'
    # emulation, and loses 15 folder-walk cases (the field never opens) only
    # under Rosetta, where the run also outlasts the hour. Obsidian's Mac
    # build is universal, so users there run the Arm one unless they force it.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: x64
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          LURE_SLOW: "3"
          SUITES: ${{ inputs.suites }}
        run: |
          node -p '"node runs as " + process.arch'
          .dev/ci-suites.sh

  system-electron:
    if: inputs.target == 'system-electron' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: archlinux:latest
      options: --shm-size=2g
    steps:
      - name: Obsidian from Arch's own package, on the system's Electron
        run: pacman -Syu --noconfirm obsidian nodejs npm git xorg-server-xvfb xorg-xauth curl procps-ng
      - uses: actions/checkout@v4
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          OBSIDIAN_COMMAND: obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: |
          head -5 /usr/bin/obsidian
          .dev/ci-suites.sh

  # "restricted" takes the sandbox's home and host access away and leaves
  # only the folder the vault copy and its settings live in: what Lure does
  # when the paths it is asked about are out of reach.
  flatpak:
    if: inputs.target == 'flatpak' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        access: [full, restricted]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: flatpak (${{ matrix.access }} access)
    # Restricted is a probe: what is out of reach fails, and the log says how.
    continue-on-error: ${{ matrix.access == 'restricted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Obsidian from Flathub
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q flatpak xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub md.obsidian.Obsidian
          flatpak info --user --show-permissions md.obsidian.Obsidian
      - name: Run the suites
        env:
          ACCESS: ${{ matrix.access }}
          SUITES: ${{ inputs.suites }}
        run: |
          if [ "$ACCESS" = restricted ]; then
            export OBSIDIAN_COMMAND="flatpak run --user --nofilesystem=host --nofilesystem=home --filesystem=$HOME/.cache/lure-ci md.obsidian.Obsidian"
          else
            export OBSIDIAN_COMMAND="flatpak run --user md.obsidian.Obsidian"
            # The sandbox has a /tmp of its own: the suites' files outside the
            # vault go under home, where it can see them.
            mkdir -p "$HOME/.cache/lure-ci/tmp" && export TMPDIR="$HOME/.cache/lure-ci/tmp"
          fi
          dbus-run-session -- .dev/ci-suites.sh

  snap:
    if: inputs.target == 'snap' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Obsidian from the Snap store
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          sudo snap install obsidian --classic
          snap info obsidian | head -12
      - name: Run the suites
        env:
          OBSIDIAN_COMMAND: /snap/bin/obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # The Windows build, unpacked from its installer into a Wine prefix. Paths
  # reach it as Wine spells them. Not working yet (2026-10-11): Obsidian starts
  # and says DevTools is listening, but the port never answers and no window
  # opens — the renderer seems to stop before the vault loads.
  wine:
    if: inputs.target == 'wine'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Wine and the Windows installer
        run: |
          # WineHQ's staging build: Ubuntu's Wine 9 started Obsidian and then
          # never answered on its port.
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt-get update -q && sudo apt-get install -y -q --install-recommends winehq-staging xvfb
          wine --version
          export WINEPREFIX="$HOME/.wine" WINEDEBUG=-all
          url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*Obsidian-[0-9.]*\.exe"' | head -1 | cut -d'"' -f4)
          echo "installer: $url"
          curl -sL "$url" -o /tmp/obsidian-setup.exe
          # Unpacked rather than installed: the silent install under Wine left
          # no Obsidian.exe behind. The NSIS installer carries the app as a 7z.
          sudo apt-get install -y -q p7zip-full
          7z x -y -o/tmp/nsis /tmp/obsidian-setup.exe >/dev/null
          7z x -y -o"$HOME/obsidian-win" "$(find /tmp/nsis -iname 'app-64.7z' | head -1)" >/dev/null
          wineboot -i >/dev/null 2>&1 || true
          exe=$(find "$HOME/obsidian-win" -maxdepth 2 -iname Obsidian.exe | head -1)
          echo "exe: $exe"
          echo "OBSIDIAN_EXE=$exe" >> "$GITHUB_ENV"
      - name: Run the suites
        env:
          OBSIDIAN_PATHS: wine
          WINEDEBUG: -all
          SUITES: ${{ inputs.suites }}
          # Chromium's sandbox and GPU process are what break under Wine.
          # Windows-only protections Wine cannot provide, and the GPU in-process.
          OBSIDIAN_EXTRA_ARGS: --no-sandbox --disable-gpu --disable-gpu-sandbox --in-process-gpu --disable-features=RendererCodeIntegrity,NetworkServiceSandbox
        run: OBSIDIAN_COMMAND="wine $OBSIDIAN_EXE" .dev/ci-suites.sh

  # Obsidian publishes no FreeBSD build. Its own app (the installer's
  # app.asar from the Linux tarball, and the app version on top) runs on the
  # Electron FreeBSD packages, in a FreeBSD VM on the Linux runner.
  freebsd:
    if: inputs.target == 'freebsd'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD, its Electron and the suites
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          envs: "SUITES VERSIONS"
          prepare: |
            # pgrep and pkill are in FreeBSD's base system.
            pkg install -y node npm bash curl git xorg-vfbserver xauth python3 gmake
            # The scripts ask for /bin/bash; FreeBSD keeps it in /usr/local.
            ln -sf /usr/local/bin/bash /bin/bash
            pkg search -q '^electron[0-9]' | sort -V | tail -1 | xargs pkg install -y
          run: |
            set -e
            electron=$(ls /usr/local/bin/electron* | sort -V | tail -1)
            echo "electron: $electron"
            url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*obsidian-[0-9.]*\.tar\.gz"' | head -1 | cut -d'"' -f4)
            curl -sL "$url" | tar -xz -C /tmp
            asar=$(ls -d /tmp/obsidian-*/resources/app.asar | head -1)
            npm ci
            node esbuild.config.mjs production
            # The launcher's library writes Obsidian's local storage through
            # classic-level, which ships no FreeBSD build: compiled here.
            npm install --no-save --no-package-lock obsidian-launcher@3
            (cd node_modules/classic-level && npx --yes node-gyp rebuild)
            Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
            export DISPLAY=:99 OBSIDIAN_COMMAND="$electron $asar" OBSIDIAN_EXTRA_ARGS=--no-sandbox OBSIDIAN_PLATFORM_AS=linux
            bash .dev/ci-suites.sh
        env:
          SUITES: ${{ inputs.suites }}

  # Little memory and half a CPU: a container capped by Docker, so timing
  # that only holds on a fast machine shows.
  limits-machine:
    if: inputs.target == 'limits' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      # The image the distros job already runs in, so only the limits differ.
      image: debian:12
      options: --shm-size=1g --memory=1500m --memory-swap=1500m --cpus=0.5
    name: limits (1.5 GB, half a CPU)
    steps:
      - name: tar, for the checkout
        run: apt-get update -q && apt-get install -y -q tar gzip curl
      - uses: actions/checkout@v4
      - name: System packages
        run: sh .dev/ci-distro-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          LURE_SLOW: "3"
          SUITES: ${{ inputs.suites }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          DISPLAY=:99 .dev/ci-suites.sh

  # The screen and the graphics: a netbook-sized display, a HiDPI one at
  # twice the scale, and no GPU at all (software rendering).
  limits-display:
    if: inputs.target == 'limits' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small screen 1024x600
            screen: 1024x600x24
            args: --no-sandbox
          - name: HiDPI, scale 2
            screen: 1920x1080x24
            args: --no-sandbox --force-device-scale-factor=2
          - name: no GPU
            screen: 1920x1080x24
            args: --no-sandbox --disable-gpu
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: limits (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        env:
          XVFB_SCREEN: ${{ matrix.screen }}
          OBSIDIAN_EXTRA_ARGS: ${{ matrix.args }}
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # A Wayland session instead of X: a headless Weston, and Obsidian on
  # Electron's own Wayland backend.
  wayland:
    if: inputs.target == 'wayland' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Weston, headless
        run: sudo apt-get update -q && sudo apt-get install -y -q weston
      - name: Run the suites
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations
          SUITES: ${{ inputs.suites }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" && mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-1 --width=1920 --height=1080 >weston.log 2>&1 &
          sleep 3
          WAYLAND_DISPLAY=wayland-1 .dev/ci-suites.sh

  # Obsidian as Nix packages it: wrapped to run on Nix's own Electron.
  nix:
    if: inputs.target == 'nix' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - uses: cachix/install-nix-action@v31
      - name: Obsidian from nixpkgs
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix profile install --impure nixpkgs#obsidian
          sudo apt-get install -y -q xvfb
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          head -20 "$HOME/.nix-profile/bin/obsidian" | grep -a electron | head -3 || true
      - name: Run the suites
        env:
          OBSIDIAN_COMMAND: obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # Alpine is musl; Obsidian's own binary is built for glibc and does not
  # start there even with gcompat (libudev, __memcpy_chk, posix_fallocate64).
  # Obsidian's app runs on Alpine's own Electron instead, as on FreeBSD. Run
  # through docker by hand: GitHub's actions cannot run in a musl container.
  alpine:
    if: inputs.target == 'alpine'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Alpine, its Electron and the suites
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          docker run --rm --shm-size=2g -e SUITES -e VERSIONS -v "$PWD:/repo" -w /repo alpine:edge sh -c '
            # Electron is packaged for edge only (community, else testing).
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
            apk add --no-cache bash nodejs npm curl git electron xvfb-run xvfb procps-ng font-dejavu python3 make g++ >/dev/null || { apk search -q electron | head; exit 1; }
            electron=$(command -v electron); echo "electron: $electron $($electron --version 2>/dev/null)"
            url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o "\"browser_download_url\": *\"[^\"]*obsidian-[0-9.]*\.tar\.gz\"" | head -1 | cut -d"\"" -f4)
            curl -sL "$url" | tar -xz -C /tmp
            asar=$(ls -d /tmp/obsidian-*/resources/app.asar | head -1)
            npm ci --no-audit --no-fund >/dev/null && node esbuild.config.mjs production || exit 1
            npm install --no-save --no-package-lock obsidian-launcher@3 >/dev/null 2>&1
            (cd node_modules/classic-level && node -e "require(\"node-gyp-build\")(\".\")" 2>/dev/null || npx --yes node-gyp rebuild >/dev/null)
            OBSIDIAN_COMMAND="$electron $asar" OBSIDIAN_EXTRA_ARGS=--no-sandbox bash .dev/ci-suites.sh'

  # Loaded beside every suite, the header plugins of test-compat-ui changed
  # what F2 and the rename field did even after being turned off. One job
  # per plugin, loaded alone, against exactly those cases.
  peer-residue:
    if: inputs.target == 'peer-residue'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        peer: [obsidian-icon-folder, cmdr, obsidian-hider, make-md, tab-file-path, obsidian-hover-editor,
               notebook-navigator, editor-breadcrumbs, another-name, obsidian-path-title, iconic, vertical-tabs,
               continuous-mode, obsidian-filename-heading-sync, advanced-rename-and-delete-handler, mononote, open-tab-settings]
    name: residue of ${{ matrix.peer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: F2 and the rename field, after the plugin loaded and was turned off
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          EXTRA_PLUGINS: ${{ matrix.peer }}
        run: |
          set +e
          failed=0
          SUITE_FILTER=F2 OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-keyleak || failed=1
          SUITE_FILTER=renaming OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-links || failed=1
          exit $failed

  # Where the page spends its time when a peer freezes it (Iconic did, in
  # test-compat-ui): .dev/probe-freeze.mjs pauses it and prints the stacks.
  freeze-probe:
    if: inputs.target == 'freeze-probe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        peer: [iconic]
        lure: ["on", "off"]
        # Linux runs under a virtual display; Windows and macOS have a real
        # desktop session, which says whether a freeze is the display's.
        os: [ubuntu-latest, windows-2025, macos-15]
    name: freeze probe, ${{ matrix.peer }}, Lure ${{ matrix.lure }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs readable
      - name: Turn the peer on and sample the stack
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ matrix.peer }}
          LURE_OFF: ${{ matrix.lure == 'off' && '1' || '' }}
          OBSIDIAN_VERSION: latest
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            OBSIDIAN_EXTRA_ARGS=--no-sandbox xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh probe-freeze
          else
            .dev/ci-run.sh probe-freeze
          fi

  server-2019:
    if: inputs.target == 'server-2019' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Let the runner user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Hand the guest the repository and what to run
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          sudo mkdir -p /mnt/win /mnt/shared
          sudo chown "$USER" /mnt/win /mnt/shared
          rsync -a --exclude node_modules --exclude .git ./ /mnt/shared/repo/
          echo "$SUITES" > /mnt/shared/suites.txt
          echo "$VERSIONS" > /mnt/shared/versions.txt
      - name: Install and start Windows Server 2019 (evaluation)
        run: |
          docker run -d --name windows -e VERSION=2019 -e RAM_SIZE=10G -e CPU_CORES=4 -e DISK_SIZE=48G \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -v /mnt/win:/storage -v "$PWD/.dev/vm:/oem" -v /mnt/shared:/shared \
            --stop-timeout 120 docker.io/dockurr/windows
      - name: Wait for the suites in the guest
        run: |
          for i in $(seq 1 270); do
            [ -f /mnt/shared/done.txt ] && break
            # Setup reports its errors in setup.log: no use waiting past one.
            if grep -qa "FullyQualifiedErrorId" /mnt/shared/setup.log 2>/dev/null; then
              echo "::error::setup failed in the guest"; tr -d '\r' < /mnt/shared/setup.log; exit 1
            fi
            # Setup done and no run within a quarter of an hour: it is not coming.
            if grep -qa "setup finished" /mnt/shared/setup.log 2>/dev/null && [ ! -f /mnt/shared/run-started.txt ]; then
              setup_done=${setup_done:-$i}
              if [ $((i - setup_done)) -ge 15 ]; then echo "::error::setup finished but the run did not start"; tr -d '\r' < /mnt/shared/setup.log; exit 1; fi
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "--- minute $i"; docker logs --tail 3 windows 2>&1; ls /mnt/shared; fi
            sleep 60
          done
          echo "--- results"; cat /mnt/shared/results.txt 2>/dev/null || echo "none"
          [ -f /mnt/shared/run-error.txt ] && { echo "::error::the run in the guest stopped"; tr -d '\r' < /mnt/shared/run-error.txt; }
          [ -f /mnt/shared/done.txt ] || { echo "::error::the guest did not finish"; docker logs --tail 40 windows; exit 1; }
          ! tr -d '\r' < /mnt/shared/results.txt | grep -qvE ' (0|2)$'
      - name: Keep the guest's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-2019-logs
          path: |
            /mnt/shared/*.log
            /mnt/shared/*.txt
          if-no-files-found: ignore
