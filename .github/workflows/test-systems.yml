# The suites on systems GitHub has no runner for, on demand only:
#
# - distros: other Linux distributions, as containers on the Linux runner;
# - old-engine: today's Obsidian on its oldest installer that still runs it
#   (Electron 21, Chromium 106) — the engine Windows 7, 8 and 8.1 are left
#   with, since newer Electron dropped them — on Linux, where no old Windows
#   is needed to ask it;
# - server-2019: Windows Server 2019 (the Windows 10 1809 code base) in a
#   virtual machine on the Linux runner (dockur/windows over KVM), installed
#   from Microsoft's own 180-day evaluation image on every run;
# - linux-arm: the Arm64 AppImage on GitHub's Arm Linux runner;
# - emulated: the x64 build where the machine is Arm — Windows 11 on Arm's
#   emulation, Rosetta on Apple silicon;
# - system-electron, flatpak, snap: Obsidian as Arch packages it (on the
#   system's Electron), from Flathub, from the Snap store — each its own
#   Electron and, for Flatpak, its own sandbox;
# - wine, freebsd: the Windows build under Wine, and Obsidian's app on
#   FreeBSD's own Electron in a FreeBSD VM. Experimental: they may not start.
#
# The last five start Obsidian through obsidian-toolkit's launch-alt (OBSIDIAN_COMMAND).
#
# Actions → Test other systems → Run workflow, or
#   gh workflow run test-systems.yml -f target=distros -f suites="test-tab"
name: Test other systems

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run on"
        type: choice
        options: [distros, vault-elsewhere, distros-next, electron-next, runner-next, npm-next, peer-betas, old-engine, server-2019, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits, wayland, nix, alpine, peer-residue, freeze-probe, all]
        default: distros
      suites:
        description: "Suites, space separated"
        default: "test-html test-tab test-links"
      obsidian:
        description: "Obsidian versions"
        type: choice
        options: [both, latest, earliest]
        default: both
      why:
        description: "Set by the environment watch: what changed. A failing run then opens an issue saying so."
        default: ""

permissions:
  contents: read

env:
  VERSIONS: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

jobs:
  # Distribution containers (electron-template's reusable workflow: tar,
  # PATH, Electron's libraries, a font, Xvfb).
  distros:
    if: inputs.target == 'distros' || inputs.target == 'distros-next' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/distros.yml@v0.5.1
    with:
      # distros-next: what the next releases of each will be (a canary).
      images: ${{ inputs.target == 'distros-next' && '["debian:sid", "fedora:rawhide", "ubuntu:devel", "opensuse/tumbleweed"]' || '["debian:12", "ubuntu:20.04", "fedora:42", "archlinux:latest", "opensuse/leap:16.0"]' }}
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: bash .dev/ci-suites.sh
      toolkit-ref: v0.5.1
      # Root in a container: Electron's sandbox will not start as root.
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # Today's Obsidian on its oldest installer that still runs it (1.1.16,
  # Electron 21): ci-run.sh reads OBSIDIAN_INSTALLER.
  old-engine:
    if: inputs.target == 'old-engine' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/platform.yml@v0.13.0
    with:
      runs-on: ubuntu-latest
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_INSTALLER=1.1.16
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  linux-arm:
    if: inputs.target == 'linux-arm' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/platform.yml@v0.10.0
    with:
      runs-on: ubuntu-24.04-arm
      setup: sudo apt-get update -q && sudo apt-get install -y -q xvfb libfuse2t64 || sudo apt-get install -y -q xvfb libfuse2
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # Node is installed as x64, so the launcher fetches the x64 build and the
  # machine emulates it. The first suite says which architecture Obsidian ran.
  # Rosetta is a probe: test-tab passes on macOS natively and on Windows'
  # emulation, and loses 15 folder-walk cases (the field never opens) only
  # under Rosetta, where the run also outlasts the hour. Obsidian's Mac
  # build is universal, so users there run the Arm one unless they force it.
  emulated:
    if: inputs.target == 'emulated' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, macos-15]
    uses: Gelaende51/electron-template/.github/workflows/platform.yml@v0.10.0
    with:
      runs-on: ${{ matrix.os }}
      node-arch: x64
      slow: 3
      probe: ${{ matrix.os == 'macos-15' }}
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh

  system-electron:
    if: inputs.target == 'system-electron' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/distro-package.yml@v0.13.0
    with:
      image: archlinux:latest
      install: pacman -Syu --noconfirm obsidian nodejs npm git xorg-server-xvfb xorg-xauth curl procps-ng
      command: obsidian
      command-var: OBSIDIAN_COMMAND
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # "restricted" takes the sandbox's home and host access away and leaves
  # only the folder the vault copy and its settings live in: what Lure does
  # when the paths it is asked about are out of reach.
  # Run through electron-template's reusable flatpak workflow.
  flatpak:
    if: inputs.target == 'flatpak' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/flatpak.yml@v0.5.1
    with:
      app-id: md.obsidian.Obsidian
      command-var: OBSIDIAN_COMMAND
      data-dir: .cache/lure-ci
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      restricted-env: |
        LURE_EXPECT_SANDBOX=1

  snap:
    if: inputs.target == 'snap' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/snap.yml@v0.7.0
    with:
      snap: obsidian
      command-var: OBSIDIAN_COMMAND
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # The Windows build, unpacked from its installer into a Wine prefix. Paths
  # reach it as Wine spells them. Not working yet (2026-10-11): Obsidian starts
  # and says DevTools is listening, but the port never answers and no window
  # opens — the renderer seems to stop before the vault loads.
  # Obsidian's Windows build under WineHQ staging, the suites run by Windows'
  # Node under Wine (electron-template's reusable workflow).
  wine:
    if: inputs.target == 'wine'
    uses: Gelaende51/electron-template/.github/workflows/wine.yml@v0.6.0
    with:
      installer-repo: obsidianmd/obsidian-releases
      installer-pattern: 'Obsidian-[0-9.]*\.exe'
      exe: Obsidian.exe
      command-var: OBSIDIAN_COMMAND
      flags-var: OBSIDIAN_EXTRA_ARGS
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_PATHS=wine

  # Obsidian publishes no FreeBSD build. Its own app (the installer's
  # app.asar from the Linux tarball, and the app version on top) runs on the
  # Electron FreeBSD packages, in a FreeBSD VM on the Linux runner.
  freebsd:
    if: inputs.target == 'freebsd'
    uses: Gelaende51/obsidian-toolkit/.github/workflows/freebsd.yml@v0.5.0
    with:
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

  # Little memory and half a CPU: a container capped by Docker, so timing
  # that only holds on a fast machine shows.
  # And odd displays: a small screen, HiDPI, no GPU (electron-template).
  limits:
    if: inputs.target == 'limits' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/limits.yml@v0.9.0
    with:
      flags-var: OBSIDIAN_EXTRA_ARGS
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: bash .dev/ci-suites.sh
      toolkit-ref: v0.9.0

  # A Wayland session instead of X: a headless Weston, and Obsidian on
  # Electron's own Wayland backend.
  wayland:
    if: inputs.target == 'wayland' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/wayland.yml@v0.8.0
    with:
      flags-var: OBSIDIAN_EXTRA_ARGS
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh

  # Obsidian as Nix packages it: wrapped to run on Nix's own Electron.
  nix:
    if: inputs.target == 'nix' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/nix.yml@v0.9.0
    with:
      package: obsidian
      command-var: OBSIDIAN_COMMAND
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # Alpine is musl; Obsidian's own binary is built for glibc and does not
  # start there even with gcompat (libudev, __memcpy_chk, posix_fallocate64).
  # Obsidian's app runs on Alpine's own Electron instead, as on FreeBSD. Run
  # through docker by hand: GitHub's actions cannot run in a musl container.
  alpine:
    if: inputs.target == 'alpine'
    uses: Gelaende51/obsidian-toolkit/.github/workflows/alpine.yml@v0.5.0
    with:
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

  # Loaded beside every suite, the header plugins of test-compat-ui changed
  # what F2 and the rename field did even after being turned off. One job
  # per plugin, loaded alone, against exactly those cases.
  peer-residue:
    if: inputs.target == 'peer-residue'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        peer: [obsidian-icon-folder, cmdr, obsidian-hider, make-md, tab-file-path, obsidian-hover-editor,
               notebook-navigator, editor-breadcrumbs, another-name, obsidian-path-title, iconic, vertical-tabs,
               continuous-mode, obsidian-filename-heading-sync, advanced-rename-and-delete-handler, mononote, open-tab-settings]
    name: residue of ${{ matrix.peer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: F2 and the rename field, after the plugin loaded and was turned off
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          EXTRA_PLUGINS: ${{ matrix.peer }}
        run: |
          set +e
          failed=0
          SUITE_FILTER=F2 OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-keyleak || failed=1
          SUITE_FILTER=renaming OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-links || failed=1
          exit $failed

  # Where the page spends its time when a peer freezes it (Iconic did, in
  # test-compat-ui): .dev/probe-freeze.mjs pauses it and prints the stacks.
  freeze-probe:
    if: inputs.target == 'freeze-probe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        peer: [iconic]
        lure: ["on", "off"]
        # Linux runs under a virtual display; Windows and macOS have a real
        # desktop session, which says whether a freeze is the display's.
        os: [ubuntu-latest, windows-2025, macos-15]
    name: freeze probe, ${{ matrix.peer }}, Lure ${{ matrix.lure }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs readable
      - name: Turn the peer on and sample the stack
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ matrix.peer }}
          LURE_OFF: ${{ matrix.lure == 'off' && '1' || '' }}
          OBSIDIAN_VERSION: latest
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            OBSIDIAN_EXTRA_ARGS=--no-sandbox xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh probe-freeze
          else
            .dev/ci-run.sh probe-freeze
          fi

  server-2019:
    if: inputs.target == 'server-2019' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/windows-vm.yml@v0.12.0
    with:
      windows-version: "2019"
      guest-scripts: .dev/vm
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

  # The vault somewhere other than under the home folder: a folder outside it,
  # a real SMB network share (served and mounted on the runner itself), a
  # second drive, a UNC path. Nothing in Lure or the suites may assume where
  # a vault is.
  vault-elsewhere:
    if: inputs.target == 'vault-elsewhere' || inputs.target == 'all'
    uses: Gelaende51/electron-template/.github/workflows/data-elsewhere.yml@v0.11.0
    with:
      parent-var: LURE_VAULT_PARENT
      suites: ${{ inputs.suites }}
      versions: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}
      run: .dev/ci-suites.sh
      suite-env: |
        OBSIDIAN_EXTRA_ARGS=--no-sandbox

  # ---------------------------------------------------------------- canaries
  # What is coming rather than what is out: a heads-up, started weekly by
  # test-canary.yml. A failure here is a warning about a future release.

  # Obsidian's own app on the next Electron (npm's electron@beta), before an
  # installer ships with it: Chromium's layout and APIs as they will be.
  electron-next:
    if: inputs.target == 'electron-next'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - name: The next Electron, and Obsidian's app for it
        run: |
          npm install --prefix /tmp/electron-next electron@beta >/dev/null
          # npm no longer runs install scripts unasked, and Electron's
          # downloads the binary: run it.
          node /tmp/electron-next/node_modules/electron/install.js
          electron=/tmp/electron-next/node_modules/electron/dist/electron
          echo "electron: $($electron --version 2>/dev/null)"
          url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*obsidian-[0-9.]*\.tar\.gz"' | head -1 | cut -d'"' -f4)
          curl -sL "$url" | tar -xz -C /tmp
          echo "OBSIDIAN_COMMAND=$electron $(ls -d /tmp/obsidian-*/resources/app.asar | head -1)" >> "$GITHUB_ENV"
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The next Ubuntu runner image, with the launcher's own Obsidian.
  runner-next:
    if: inputs.target == 'runner-next'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - run: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The next build and type tools (TypeScript's nightly, the newest of the
  # rest, Obsidian's API types as they stand on GitHub), then the suites.
  npm-next:
    if: inputs.target == 'npm-next'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: The next versions
        run: |
          next="typescript@next esbuild@latest eslint@latest typescript-eslint@latest eslint-plugin-obsidianmd@latest picomatch@latest obsidian@github:obsidianmd/obsidian-api"
          # A peer range that does not take the next version yet is itself the
          # heads-up: said as a warning, then installed regardless.
          if ! npm install --no-save $next 2>/tmp/npm.err; then
            grep -E "Could not resolve|peer .* from" /tmp/npm.err | sed 's/^npm error /::warning::npm-next: /' | head -5
            npm install --no-save --legacy-peer-deps $next
          fi
          npm ls typescript esbuild eslint eslint-plugin-obsidianmd obsidian picomatch --depth=0 || true
      - name: Type-check and build with them
        run: npx tsc -noEmit -skipLibCheck && npm run check:lang && node esbuild.config.mjs production
      # Lint on its own: a linter that does not take the next TypeScript yet
      # (typescript-eslint refused TS 7 at first) is the heads-up, said as a
      # warning, and the type check and the suites still run.
      - name: Lint with them
        run: |
          if ! npx eslint src > /tmp/lint.log 2>&1; then
            tail -20 /tmp/lint.log
            echo "::warning::npm-next: lint fails with the next versions: $(grep -m1 -E 'Error:|error ' /tmp/lint.log | cut -c1-160)"
          fi
      - run: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The neighbouring plugins at their newest pre-releases, where they have
  # one newer than their last release (obsidian-toolkit's peer-betas).
  peer-betas:
    if: inputs.target == 'peer-betas'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          PEER_CHANNEL: beta
          GITHUB_TOKEN: ${{ github.token }}
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # Started by the environment watch (watch.yml): a failure is reported as an
  # issue naming what changed, since nobody is looking at a scheduled run.
  # One issue per target, closed when it passes again (development-template).
  report:
    needs: [distros, vault-elsewhere, old-engine, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits, wayland, nix, alpine, server-2019, electron-next, runner-next, npm-next, peer-betas]
    if: always() && inputs.why != ''
    uses: Gelaende51/development-template/.github/workflows/target-issue.yml@v1
    permissions:
      issues: write
    with:
      target: ${{ inputs.target }}
      why: ${{ inputs.why }}
      failed: ${{ contains(needs.*.result, 'failure') }}
      cancelled: ${{ contains(needs.*.result, 'cancelled') }}
