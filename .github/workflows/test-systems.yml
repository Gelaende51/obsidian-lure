# The suites on systems GitHub has no runner for, on demand only:
#
# - distros: other Linux distributions, as containers on the Linux runner;
# - old-engine: today's Obsidian on its oldest installer that still runs it
#   (Electron 21, Chromium 106) — the engine Windows 7, 8 and 8.1 are left
#   with, since newer Electron dropped them — on Linux, where no old Windows
#   is needed to ask it;
# - server-2019: Windows Server 2019 (the Windows 10 1809 code base) in a
#   virtual machine on the Linux runner (dockur/windows over KVM), installed
#   from Microsoft's own 180-day evaluation image on every run;
# - linux-arm: the Arm64 AppImage on GitHub's Arm Linux runner;
# - emulated: the x64 build where the machine is Arm — Windows 11 on Arm's
#   emulation, Rosetta on Apple silicon;
# - system-electron, flatpak, snap: Obsidian as Arch packages it (on the
#   system's Electron), from Flathub, from the Snap store — each its own
#   Electron and, for Flatpak, its own sandbox;
# - wine, freebsd: the Windows build under Wine, and Obsidian's app on
#   FreeBSD's own Electron in a FreeBSD VM. Experimental: they may not start.
#
# The last five start Obsidian through .dev/ci-launch-alt.mjs (OBSIDIAN_COMMAND).
#
# Actions → Test other systems → Run workflow, or
#   gh workflow run test-systems.yml -f target=distros -f suites="test-tab"
name: Test other systems

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run on"
        type: choice
        options: [distros, vault-elsewhere, distros-next, electron-next, runner-next, npm-next, peer-betas, obsidian-beta, old-engine, server-2019, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits, wayland, nix, alpine, peer-residue, freeze-probe, all]
        default: distros
      suites:
        description: "Suites, space separated"
        default: "test-html test-tab test-links"
      obsidian:
        description: "Obsidian versions"
        type: choice
        options: [both, latest, earliest]
        default: both
      why:
        description: "Set by the environment watch: what changed. A failing run then opens an issue saying so."
        default: ""

permissions:
  contents: read

env:
  VERSIONS: ${{ inputs.obsidian == 'both' && 'earliest latest' || inputs.obsidian }}

jobs:
  distros:
    if: inputs.target == 'distros' || inputs.target == 'distros-next' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # distros-next: what the next releases of each will be (a canary).
        image: ${{ fromJSON(inputs.target == 'distros-next' && '["debian:sid", "fedora:rawhide", "ubuntu:devel", "opensuse/tumbleweed"]' || '["debian:12", "ubuntu:20.04", "fedora:42", "archlinux:latest", "opensuse/leap:16.0"]') }}
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g
    name: ${{ matrix.image }}
    steps:
      # Checkout unpacks with tar, which the smallest images (openSUSE Leap)
      # leave out.
      - name: tar, for the checkout
        run: |
          # An image that declares no PATH of its own (openSUSE) is left with
          # only the tool cache once setup-node adds to it: no /usr/bin, no sh.
          echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"
          command -v tar >/dev/null && exit 0
          # A font: openSUSE's images have none, and text with no font lays out
          # with no height (a long textarea then has nothing to scroll).
          if command -v zypper >/dev/null; then zypper --non-interactive --gpg-auto-import-keys refresh && zypper --non-interactive install bash-sh tar gzip dejavu-fonts
          elif command -v dnf >/dev/null; then dnf install -y tar gzip
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm tar gzip
          else apt-get update -q && apt-get install -y -q tar gzip; fi
      - uses: actions/checkout@v7
      - name: System packages
        run: sh .dev/ci-distro-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          # Root in a container: Electron's sandbox will not start as root.
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: |
          set +e
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          failed=0
          for version in $VERSIONS; do
            for suite in $SUITES; do
              echo "::group::$suite (Obsidian $version)"
              OBSIDIAN_VERSION=$version .dev/ci-run.sh "$suite"; code=$?
              echo "::endgroup::"
              case $code in 0) ;; 2) echo "::warning::$suite ($version) skipped cases" ;; *) echo "::error::$suite ($version) failed"; failed=1 ;; esac
            done
          done
          exit $failed

  old-engine:
    if: inputs.target == 'old-engine' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites on installer 1.1.16 (Electron 21)
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          OBSIDIAN_INSTALLER: "1.1.16"
          SUITES: ${{ inputs.suites }}
        run: |
          set +e
          failed=0
          for version in $VERSIONS; do
            for suite in $SUITES; do
              echo "::group::$suite (Obsidian $version, installer 1.1.16)"
              OBSIDIAN_VERSION=$version xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh "$suite"; code=$?
              echo "::endgroup::"
              case $code in 0) ;; 2) echo "::warning::$suite ($version) skipped cases" ;; *) echo "::error::$suite ($version) failed"; failed=1 ;; esac
            done
          done
          exit $failed

  linux-arm:
    if: inputs.target == 'linux-arm' || inputs.target == 'all'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libfuse2t64 || sudo apt-get install -y -q xvfb libfuse2
      - name: Run the suites
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # Node is installed as x64, so the launcher fetches the x64 build and the
  # machine emulates it. The first suite says which architecture Obsidian ran.
  emulated:
    if: inputs.target == 'emulated' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    name: x64 emulated on ${{ matrix.os }}
    # Rosetta is a probe: test-tab passes on macOS natively and on Windows'
    # emulation, and loses 15 folder-walk cases (the field never opens) only
    # under Rosetta, where the run also outlasts the hour. Obsidian's Mac
    # build is universal, so users there run the Arm one unless they force it.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: x64
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          LURE_SLOW: "3"
          SUITES: ${{ inputs.suites }}
        run: |
          node -p '"node runs as " + process.arch'
          .dev/ci-suites.sh

  system-electron:
    if: inputs.target == 'system-electron' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: archlinux:latest
      options: --shm-size=2g
    steps:
      - name: Obsidian from Arch's own package, on the system's Electron
        run: pacman -Syu --noconfirm obsidian nodejs npm git xorg-server-xvfb xorg-xauth curl procps-ng
      - uses: actions/checkout@v7
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          OBSIDIAN_COMMAND: obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: |
          head -5 /usr/bin/obsidian
          .dev/ci-suites.sh

  # "restricted" takes the sandbox's home and host access away and leaves
  # only the folder the vault copy and its settings live in: what Lure does
  # when the paths it is asked about are out of reach.
  flatpak:
    if: inputs.target == 'flatpak' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        access: [full, restricted]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: flatpak (${{ matrix.access }} access)
    # Restricted: what is out of reach is skipped, and the external suite
    # checks instead that Lure says the sandbox is why.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Obsidian from Flathub
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q flatpak xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub md.obsidian.Obsidian
          flatpak info --user --show-permissions md.obsidian.Obsidian
      - name: Run the suites
        env:
          ACCESS: ${{ matrix.access }}
          SUITES: ${{ inputs.suites }}
        run: |
          if [ "$ACCESS" = restricted ]; then
            export OBSIDIAN_COMMAND="flatpak run --user --nofilesystem=host --nofilesystem=home --filesystem=$HOME/.cache/lure-ci md.obsidian.Obsidian"
            export LURE_EXPECT_SANDBOX=1
          else
            export OBSIDIAN_COMMAND="flatpak run --user md.obsidian.Obsidian"
            # The sandbox has a /tmp of its own: the suites' files outside the
            # vault go under home, where it can see them.
            mkdir -p "$HOME/.cache/lure-ci/tmp" && export TMPDIR="$HOME/.cache/lure-ci/tmp"
          fi
          dbus-run-session -- .dev/ci-suites.sh

  snap:
    if: inputs.target == 'snap' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Obsidian from the Snap store
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          sudo snap install obsidian --classic
          snap info obsidian | head -12
      - name: Run the suites
        env:
          OBSIDIAN_COMMAND: /snap/bin/obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # The Windows build, unpacked from its installer into a Wine prefix. Paths
  # reach it as Wine spells them. Not working yet (2026-10-11): Obsidian starts
  # and says DevTools is listening, but the port never answers and no window
  # opens — the renderer seems to stop before the vault loads.
  wine:
    if: inputs.target == 'wine'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Wine and the Windows installer
        run: |
          # WineHQ's staging build: Ubuntu's Wine 9 started Obsidian and then
          # never answered on its port.
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt-get update -q && sudo apt-get install -y -q --install-recommends winehq-staging xvfb
          wine --version
          export WINEPREFIX="$HOME/.wine" WINEDEBUG=-all
          url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*Obsidian-[0-9.]*\.exe"' | head -1 | cut -d'"' -f4)
          echo "installer: $url"
          curl -sL "$url" -o /tmp/obsidian-setup.exe
          # Unpacked rather than installed: the silent install under Wine left
          # no Obsidian.exe behind. The NSIS installer carries the app as a 7z.
          sudo apt-get install -y -q p7zip-full
          7z x -y -o/tmp/nsis /tmp/obsidian-setup.exe >/dev/null
          7z x -y -o"$HOME/obsidian-win" "$(find /tmp/nsis -iname 'app-64.7z' | head -1)" >/dev/null
          wineboot -i >/dev/null 2>&1 || true
          exe=$(find "$HOME/obsidian-win" -maxdepth 2 -iname Obsidian.exe | head -1)
          echo "exe: $exe"
          echo "OBSIDIAN_EXE=$exe" >> "$GITHUB_ENV"
          # Windows' Node, to run the suites on the same side of the paths.
          v=$(curl -s https://nodejs.org/dist/index.json | jq -r '[.[] | select(.version | startswith("v24."))][0].version')
          curl -sL "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -o /tmp/node-win.zip
          unzip -q /tmp/node-win.zip -d "$HOME" && mv "$HOME/node-$v-win-x64" "$HOME/node-win"
          wine "$HOME/node-win/node.exe" --version
          # The suites build their string tables with esbuild, whose binary
          # is per platform: Windows' Node looks for Windows' one.
          # npm skips a package for another OS even with --force, so the
          # binary is unpacked by hand and named in ESBUILD_BINARY_PATH.
          esv=$(node -p 'require("./node_modules/esbuild/package.json").version')
          (cd /tmp && npm pack "@esbuild/win32-x64@$esv" --silent | xargs tar -xzf)
          echo "ESBUILD_BINARY_PATH=$(winepath -w /tmp/package/esbuild.exe)" >> "$GITHUB_ENV"
          echo "SUITE_NODE=wine $HOME/node-win/node.exe" >> "$GITHUB_ENV"
      - name: Run the suites
        env:
          OBSIDIAN_PATHS: wine
          WINEDEBUG: -all
          SUITES: ${{ inputs.suites }}
          # Chromium's sandbox and GPU process are what break under Wine.
          # Windows-only protections Wine cannot provide, and the GPU in-process.
          OBSIDIAN_EXTRA_ARGS: --no-sandbox --disable-gpu --disable-gpu-sandbox --in-process-gpu --disable-features=RendererCodeIntegrity,NetworkServiceSandbox
        run: OBSIDIAN_COMMAND="wine $OBSIDIAN_EXE" .dev/ci-suites.sh

  # Obsidian publishes no FreeBSD build. Its own app (the installer's
  # app.asar from the Linux tarball, and the app version on top) runs on the
  # Electron FreeBSD packages, in a FreeBSD VM on the Linux runner.
  freebsd:
    if: inputs.target == 'freebsd'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: FreeBSD, its Electron and the suites
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          envs: "SUITES VERSIONS"
          prepare: |
            # pgrep and pkill are in FreeBSD's base system.
            pkg install -y node npm bash curl git xorg-vfbserver xauth python3 gmake dejavu
            # The scripts ask for /bin/bash; FreeBSD keeps it in /usr/local.
            ln -sf /usr/local/bin/bash /bin/bash
            pkg search -q '^electron[0-9]' | sort -V | tail -1 | xargs pkg install -y
          run: |
            set -e
            electron=$(ls /usr/local/bin/electron* | sort -V | tail -1)
            echo "electron: $electron"
            url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*obsidian-[0-9.]*\.tar\.gz"' | head -1 | cut -d'"' -f4)
            curl -sL "$url" | tar -xz -C /tmp
            asar=$(ls -d /tmp/obsidian-*/resources/app.asar | head -1)
            npm ci
            node esbuild.config.mjs production
            # The launcher's library writes Obsidian's local storage through
            # classic-level, which ships no FreeBSD build: compiled here.
            npm install --no-save --no-package-lock obsidian-launcher@3
            (cd node_modules/classic-level && npx --yes node-gyp rebuild)
            Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
            export DISPLAY=:99 OBSIDIAN_COMMAND="$electron $asar" OBSIDIAN_EXTRA_ARGS=--no-sandbox OBSIDIAN_PLATFORM_AS=linux
            bash .dev/ci-suites.sh
        env:
          SUITES: ${{ inputs.suites }}

  # Little memory and half a CPU: a container capped by Docker, so timing
  # that only holds on a fast machine shows.
  limits-machine:
    if: inputs.target == 'limits' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      # The image the distros job already runs in, so only the limits differ.
      image: debian:12
      options: --shm-size=1g --memory=1500m --memory-swap=1500m --cpus=0.5
    name: limits (1.5 GB, half a CPU)
    steps:
      - name: tar, for the checkout
        run: apt-get update -q && apt-get install -y -q tar gzip curl
      - uses: actions/checkout@v7
      - name: System packages
        run: sh .dev/ci-distro-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          LURE_SLOW: "3"
          SUITES: ${{ inputs.suites }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          DISPLAY=:99 .dev/ci-suites.sh

  # The screen and the graphics: a netbook-sized display, a HiDPI one at
  # twice the scale, and no GPU at all (software rendering).
  limits-display:
    if: inputs.target == 'limits' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small screen 1024x600
            screen: 1024x600x24
            args: --no-sandbox
          - name: HiDPI, scale 2
            screen: 1920x1080x24
            args: --no-sandbox --force-device-scale-factor=2
          - name: no GPU
            screen: 1920x1080x24
            args: --no-sandbox --disable-gpu
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: limits (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Run the suites
        env:
          XVFB_SCREEN: ${{ matrix.screen }}
          OBSIDIAN_EXTRA_ARGS: ${{ matrix.args }}
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # A Wayland session instead of X: a headless Weston, and Obsidian on
  # Electron's own Wayland backend.
  wayland:
    if: inputs.target == 'wayland' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: Weston, headless
        run: sudo apt-get update -q && sudo apt-get install -y -q weston
      - name: Run the suites
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations
          SUITES: ${{ inputs.suites }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" && mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-1 --width=1920 --height=1080 >weston.log 2>&1 &
          sleep 3
          WAYLAND_DISPLAY=wayland-1 .dev/ci-suites.sh

  # Obsidian as Nix packages it: wrapped to run on Nix's own Electron.
  nix:
    if: inputs.target == 'nix' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - uses: cachix/install-nix-action@v31
      - name: Obsidian from nixpkgs
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix profile install --impure nixpkgs#obsidian
          sudo apt-get install -y -q xvfb
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          head -20 "$HOME/.nix-profile/bin/obsidian" | grep -a electron | head -3 || true
      - name: Run the suites
        env:
          OBSIDIAN_COMMAND: obsidian
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          SUITES: ${{ inputs.suites }}
        run: .dev/ci-suites.sh

  # Alpine is musl; Obsidian's own binary is built for glibc and does not
  # start there even with gcompat (libudev, __memcpy_chk, posix_fallocate64).
  # Obsidian's app runs on Alpine's own Electron instead, as on FreeBSD. Run
  # through docker by hand: GitHub's actions cannot run in a musl container.
  alpine:
    if: inputs.target == 'alpine'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Alpine, its Electron and the suites
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          docker run --rm --shm-size=2g -e SUITES -e VERSIONS -v "$PWD:/repo" -w /repo alpine:edge sh -c '
            # Electron is packaged for edge only (community, else testing).
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
            apk add --no-cache bash nodejs npm curl git electron xvfb-run xvfb procps-ng font-dejavu python3 make g++ >/dev/null || { apk search -q electron | head; exit 1; }
            electron=$(command -v electron); echo "electron: $electron $($electron --version 2>/dev/null)"
            url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o "\"browser_download_url\": *\"[^\"]*obsidian-[0-9.]*\.tar\.gz\"" | head -1 | cut -d"\"" -f4)
            curl -sL "$url" | tar -xz -C /tmp
            asar=$(ls -d /tmp/obsidian-*/resources/app.asar | head -1)
            npm ci --no-audit --no-fund >/dev/null && node esbuild.config.mjs production || exit 1
            npm install --no-save --no-package-lock obsidian-launcher@3 >/dev/null 2>&1
            (cd node_modules/classic-level && node -e "require(\"node-gyp-build\")(\".\")" 2>/dev/null || npx --yes node-gyp rebuild >/dev/null)
            OBSIDIAN_COMMAND="$electron $asar" OBSIDIAN_EXTRA_ARGS=--no-sandbox bash .dev/ci-suites.sh'

  # Loaded beside every suite, the header plugins of test-compat-ui changed
  # what F2 and the rename field did even after being turned off. One job
  # per plugin, loaded alone, against exactly those cases.
  peer-residue:
    if: inputs.target == 'peer-residue'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        peer: [obsidian-icon-folder, cmdr, obsidian-hider, make-md, tab-file-path, obsidian-hover-editor,
               notebook-navigator, editor-breadcrumbs, another-name, obsidian-path-title, iconic, vertical-tabs,
               continuous-mode, obsidian-filename-heading-sync, advanced-rename-and-delete-handler, mononote, open-tab-settings]
    name: residue of ${{ matrix.peer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: F2 and the rename field, after the plugin loaded and was turned off
        shell: bash
        env:
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          EXTRA_PLUGINS: ${{ matrix.peer }}
        run: |
          set +e
          failed=0
          SUITE_FILTER=F2 OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-keyleak || failed=1
          SUITE_FILTER=renaming OBSIDIAN_VERSION=latest xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh test-links || failed=1
          exit $failed

  # Where the page spends its time when a peer freezes it (Iconic did, in
  # test-compat-ui): .dev/probe-freeze.mjs pauses it and prints the stacks.
  freeze-probe:
    if: inputs.target == 'freeze-probe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        peer: [iconic]
        lure: ["on", "off"]
        # Linux runs under a virtual display; Windows and macOS have a real
        # desktop session, which says whether a freeze is the display's.
        os: [ubuntu-latest, windows-2025, macos-15]
    name: freeze probe, ${{ matrix.peer }}, Lure ${{ matrix.lure }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs readable
      - name: Turn the peer on and sample the stack
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ matrix.peer }}
          LURE_OFF: ${{ matrix.lure == 'off' && '1' || '' }}
          OBSIDIAN_VERSION: latest
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            OBSIDIAN_EXTRA_ARGS=--no-sandbox xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh probe-freeze
          else
            .dev/ci-run.sh probe-freeze
          fi

  server-2019:
    if: inputs.target == 'server-2019' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Let the runner user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Hand the guest the repository and what to run
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          sudo mkdir -p /mnt/win /mnt/shared
          sudo chown "$USER" /mnt/win /mnt/shared
          rsync -a --exclude node_modules --exclude .git ./ /mnt/shared/repo/
          echo "$SUITES" > /mnt/shared/suites.txt
          echo "$VERSIONS" > /mnt/shared/versions.txt
      - name: Install and start Windows Server 2019 (evaluation)
        run: |
          docker run -d --name windows -e VERSION=2019 -e RAM_SIZE=10G -e CPU_CORES=4 -e DISK_SIZE=48G \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -v /mnt/win:/storage -v "$PWD/.dev/vm:/oem" -v /mnt/shared:/shared \
            --stop-timeout 120 docker.io/dockurr/windows
      - name: Wait for the suites in the guest
        run: |
          for i in $(seq 1 270); do
            [ -f /mnt/shared/done.txt ] && break
            # Setup reports its errors in setup.log: no use waiting past one.
            if grep -qa "FullyQualifiedErrorId" /mnt/shared/setup.log 2>/dev/null; then
              echo "::error::setup failed in the guest"; tr -d '\r' < /mnt/shared/setup.log; exit 1
            fi
            # Setup done and no run within a quarter of an hour: it is not coming.
            if grep -qa "setup finished" /mnt/shared/setup.log 2>/dev/null && [ ! -f /mnt/shared/run-started.txt ]; then
              setup_done=${setup_done:-$i}
              if [ $((i - setup_done)) -ge 15 ]; then echo "::error::setup finished but the run did not start"; tr -d '\r' < /mnt/shared/setup.log; exit 1; fi
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "--- minute $i"; docker logs --tail 3 windows 2>&1; ls /mnt/shared; fi
            sleep 60
          done
          echo "--- results"; cat /mnt/shared/results.txt 2>/dev/null || echo "none"
          [ -f /mnt/shared/run-error.txt ] && { echo "::error::the run in the guest stopped"; tr -d '\r' < /mnt/shared/run-error.txt; }
          [ -f /mnt/shared/done.txt ] || { echo "::error::the guest did not finish"; docker logs --tail 40 windows; exit 1; }
          ! tr -d '\r' < /mnt/shared/results.txt | grep -qvE ' (0|2)$'
      - name: Keep the guest's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-2019-logs
          path: |
            /mnt/shared/*.log
            /mnt/shared/*.txt
          if-no-files-found: ignore

  # The vault somewhere other than under the home folder: a folder outside it,
  # a real SMB network share (served and mounted on the runner itself), a
  # second drive, a UNC path. Nothing in Lure or the suites may assume where
  # a vault is.
  vault-elsewhere:
    if: inputs.target == 'vault-elsewhere' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { place: "outside home (/srv)", os: ubuntu-latest, kind: srv }
          - { place: "SMB network share", os: ubuntu-latest, kind: smb }
          - { place: "NFS share", os: ubuntu-latest, kind: nfs }
          - { place: "NFS share on macOS", os: macos-latest, kind: nfs-mac }
          - { place: "second drive (D:)", os: windows-latest, kind: drive }
          - { place: "UNC share (\\\\<machine>\\lure)", os: windows-latest, kind: unc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    name: vault on ${{ matrix.place }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node esbuild.config.mjs production
      - name: The place
        shell: bash
        run: |
          case "${{ matrix.kind }}" in
            srv)
              sudo mkdir -p /srv/lure-vaults && sudo chown "$USER" /srv/lure-vaults
              echo "LURE_VAULT_PARENT=/srv/lure-vaults" >> "$GITHUB_ENV" ;;
            smb)
              sudo apt-get update -q && sudo apt-get install -y -q samba cifs-utils xvfb >/dev/null
              sudo mkdir -p /srv/lure-share && sudo chown "$USER" /srv/lure-share
              printf '[lure]\n path = /srv/lure-share\n read only = no\n guest ok = yes\n force user = %s\n' "$USER" | sudo tee -a /etc/samba/smb.conf >/dev/null
              sudo systemctl restart smbd
              sudo mkdir -p /mnt/lure-smb
              sudo mount -t cifs //127.0.0.1/lure /mnt/lure-smb -o guest,uid=$(id -u),gid=$(id -g),vers=3.0
              mount | grep lure-smb
              echo "LURE_VAULT_PARENT=/mnt/lure-smb" >> "$GITHUB_ENV" ;;
            nfs)
              sudo apt-get update -q && sudo apt-get install -y -q nfs-kernel-server nfs-common >/dev/null
              sudo mkdir -p /srv/lure-nfs && sudo chown "$USER" /srv/lure-nfs
              echo "/srv/lure-nfs 127.0.0.1(rw,sync,no_subtree_check,all_squash,anonuid=$(id -u),anongid=$(id -g))" | sudo tee -a /etc/exports >/dev/null
              sudo exportfs -ra && sudo systemctl restart nfs-kernel-server
              sudo mkdir -p /mnt/lure-nfs && sudo mount -t nfs 127.0.0.1:/srv/lure-nfs /mnt/lure-nfs
              mount | grep lure-nfs
              echo "LURE_VAULT_PARENT=/mnt/lure-nfs" >> "$GITHUB_ENV" ;;
            nfs-mac)
              mkdir -p "$HOME/lure-nfs-export" "$HOME/lure-nfs"
              echo "$HOME/lure-nfs-export -alldirs -mapall=$(id -u):$(id -g) localhost" | sudo tee /etc/exports >/dev/null
              sudo nfsd enable; sudo nfsd restart; sleep 3; showmount -e localhost || true
              sudo mount -t nfs -o resvport,nolocks,locallocks localhost:"$HOME/lure-nfs-export" "$HOME/lure-nfs"
              mount | grep lure-nfs
              echo "LURE_VAULT_PARENT=$HOME/lure-nfs" >> "$GITHUB_ENV" ;;
            drive)
              mkdir -p /d/lure-vaults
              echo "LURE_VAULT_PARENT=D:\\lure-vaults" >> "$GITHUB_ENV" ;;
            unc)
              mkdir -p /c/lure-share
              powershell -NoProfile -Command "New-SmbShare -Name lure -Path C:\\lure-share -FullAccess Everyone | Out-Null; Get-SmbShare -Name lure"
              # The machine's own name, not localhost: a file:// URL keeps a
              # real host, and localhost is emptied by the URL parser.
              echo "LURE_VAULT_PARENT=\\\\$COMPUTERNAME\\lure" >> "$GITHUB_ENV" ;;
          esac
      - name: Run the suites
        shell: bash
        env:
          SUITES: ${{ inputs.suites }}
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # ---------------------------------------------------------------- canaries
  # What is coming rather than what is out: a heads-up, started weekly by
  # test-canary.yml. A failure here is a warning about a future release.

  # Obsidian's own app on the next Electron (npm's electron@beta), before an
  # installer ships with it: Chromium's layout and APIs as they will be.
  electron-next:
    if: inputs.target == 'electron-next'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - name: The next Electron, and Obsidian's app for it
        run: |
          npm install --prefix /tmp/electron-next electron@beta >/dev/null
          # npm no longer runs install scripts unasked, and Electron's
          # downloads the binary: run it.
          node /tmp/electron-next/node_modules/electron/install.js
          electron=/tmp/electron-next/node_modules/electron/dist/electron
          echo "electron: $($electron --version 2>/dev/null)"
          url=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -o '"browser_download_url": *"[^"]*obsidian-[0-9.]*\.tar\.gz"' | head -1 | cut -d'"' -f4)
          curl -sL "$url" | tar -xz -C /tmp
          echo "OBSIDIAN_COMMAND=$electron $(ls -d /tmp/obsidian-*/resources/app.asar | head -1)" >> "$GITHUB_ENV"
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The next Ubuntu runner image, with the launcher's own Obsidian.
  runner-next:
    if: inputs.target == 'runner-next'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - run: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The next build and type tools (TypeScript's nightly, the newest of the
  # rest, Obsidian's API types as they stand on GitHub), then the suites.
  npm-next:
    if: inputs.target == 'npm-next'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: The next versions
        run: |
          next="typescript@next esbuild@latest eslint@latest typescript-eslint@latest eslint-plugin-obsidianmd@latest picomatch@latest obsidian@github:obsidianmd/obsidian-api"
          # A peer range that does not take the next version yet is itself the
          # heads-up: said as a warning, then installed regardless.
          if ! npm install --no-save $next 2>/tmp/npm.err; then
            grep -E "Could not resolve|peer .* from" /tmp/npm.err | sed 's/^npm error /::warning::npm-next: /' | head -5
            npm install --no-save --legacy-peer-deps $next
          fi
          npm ls typescript esbuild eslint eslint-plugin-obsidianmd obsidian picomatch --depth=0 || true
      - name: Type-check and build with them
        run: npx tsc -noEmit -skipLibCheck && npm run check:lang && node esbuild.config.mjs production
      # Lint on its own: a linter that does not take the next TypeScript yet
      # (typescript-eslint refused TS 7 at first) is the heads-up, said as a
      # warning, and the type check and the suites still run.
      - name: Lint with them
        run: |
          if ! npx eslint src > /tmp/lint.log 2>&1; then
            tail -20 /tmp/lint.log
            echo "::warning::npm-next: lint fails with the next versions: $(grep -m1 -E 'Error:|error ' /tmp/lint.log | cut -c1-160)"
          fi
      - run: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # The neighbouring plugins at their newest pre-releases, where they have
  # one newer than their last release (.dev/peer-betas.mjs).
  peer-betas:
    if: inputs.target == 'peer-betas'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && node esbuild.config.mjs production
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest
          PEER_CHANNEL: beta
          GITHUB_TOKEN: ${{ github.token }}
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # Obsidian's own beta (early access), which needs an Insider account:
  # repository secrets OBSIDIAN_EMAIL and OBSIDIAN_PASSWORD, set by the
  # maintainer. Without them, or with no beta out, there is nothing to run.
  obsidian-beta:
    if: inputs.target == 'obsidian-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
      OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - id: beta
        name: Is there a beta, and may it be fetched?
        run: |
          if [ -z "$OBSIDIAN_EMAIL" ] || [ -z "$OBSIDIAN_PASSWORD" ]; then
            echo "::notice::No Insider credentials (OBSIDIAN_EMAIL, OBSIDIAN_PASSWORD): Obsidian's beta is not tested."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Sign in now, beta or not, so a wrong password or a 2FA prompt shows
          # before a beta is out. Only the outcome is printed.
          node -e '
            fetch("https://api.obsidian.md/user/signin", { method: "POST",
              // As obsidian-launcher asks, from the app origin, so the answer is the one it will get.
              headers: { "content-type": "application/json", origin: "app://obsidian.md", "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.183 Safari/537.36" },
              body: JSON.stringify({ email: process.env.OBSIDIAN_EMAIL, password: process.env.OBSIDIAN_PASSWORD, mfa: "" }) })
              .then((r) => r.json()).then((j) => {
                if (j.token) { console.log("signed in to the Obsidian account"); return; }
                console.log(`::error::Obsidian sign-in failed: ${String(j.error ?? "no token").slice(0, 120)}`); process.exit(1);
              });'
          npm install --no-save --no-package-lock obsidian-launcher@3 >/dev/null 2>&1
          versions=$(node --input-type=module -e 'const { default: L } = await import("obsidian-launcher"); const l = new L(); const [b] = await l.resolveVersion("latest-beta"); const [s] = await l.resolveVersion("latest"); console.log(b + " " + s);')
          read -r beta stable <<< "$versions"
          echo "beta $beta, release $stable"
          if [ "$beta" = "$stable" ]; then echo "::notice::No beta newer than $stable."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.beta.outputs.run == 'true'
        run: npm ci && node esbuild.config.mjs production
      - if: steps.beta.outputs.run == 'true'
        name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: latest-beta
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
        run: .dev/ci-suites.sh

  # Started by the environment watch (watch.yml): a failure is reported as an
  # issue naming what changed, since nobody is looking at a scheduled run.
  report:
    needs: [distros, vault-elsewhere, old-engine, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits-machine, limits-display, wayland, nix, alpine, server-2019, electron-next, runner-next, npm-next, peer-betas, obsidian-beta]
    if: always() && inputs.why != '' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ inputs.why }}
          TARGET: ${{ inputs.target }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One issue per target, kept open: a later failure is a comment on
          # it, so a canary that fails week after week does not pile up.
          title="Tests fail on $TARGET"
          body="$(printf '%s\n\nRun: %s' "$WHY" "$RUN")"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  # The same target passing again closes its issue.
  all-clear:
    needs: [distros, vault-elsewhere, old-engine, linux-arm, emulated, system-electron, flatpak, snap, wine, freebsd, limits-machine, limits-display, wayland, nix, alpine, server-2019, electron-next, runner-next, npm-next, peer-betas, obsidian-beta]
    if: always() && inputs.why != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Tests fail on $TARGET"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number"); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN"
          done
