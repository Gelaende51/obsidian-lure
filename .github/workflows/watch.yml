# Runs the suites when something Lure is tested against changes without a
# commit here: a new Obsidian release, or a new release of a plugin the suites
# install beside it (Folder notes, Quick Explorer, Breadcrumbs, …). The test
# runs install the latest of each, so they test exactly the new versions.
#
# The `environments` job does the same for the systems the tests run on
# (development-template's environment-watch, environments in devkit.config.json): a new container image, a distribution's new
# Obsidian or Electron, a new Wine or runner image runs that environment's
# target of test-systems.yml (and the main suites for a runner image), with
# what changed passed along, so a failure opens an issue naming it.
#
# The last versions seen are in .github/upstream-versions.json; a change is
# recorded after its test run, and a failing one opens an issue naming what
# moved.
name: Watch upstream

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      changes: ${{ steps.diff.outputs.changes }}
      beta: ${{ steps.diff.outputs.beta }}
    steps:
      - uses: actions/checkout@v7
      # obsidian-upstream-watch comes from obsidian-toolkit, a devDependency;
      # the neighbours are the `-p id:` list in .dev/ci-run.sh (devkit.config.json).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(node node_modules/obsidian-toolkit/bin/upstream-watch.mjs --diff)
          echo "changed=$(echo "$out" | jq -r .changed)" >> "$GITHUB_OUTPUT"
          echo "changes=$(echo "$out" | jq -c .changes)" >> "$GITHUB_OUTPUT"
          echo "beta=$(echo "$out" | jq -r '.betaNew // ""')" >> "$GITHUB_OUTPUT"
          echo "$out" | jq .now > upstream-versions.json
          echo "$out" | jq -r '.changes[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-versions
          path: upstream-versions.json

  test:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  record:
    needs: [check, test]
    if: always() && needs.test.result != 'cancelled' && ((needs.check.outputs.changed == 'true' && needs.test.result != 'skipped') || needs.check.outputs.beta != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: upstream-versions
      - name: Record the versions, and say so if Lure broke against them
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.check.outputs.changes }}
          RESULT: ${{ needs.test.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          list=$(echo "$CHANGES" | jq -r '.[]' | sed 's/^/- /')
          mv upstream-versions.json .github/upstream-versions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-versions.json
          # A new Obsidian beta alone is recorded for the maintainer's machine
          # to test (obsidian-toolkit's beta-pending finds it there); its results stay off GitHub.
          if [ "${{ needs.check.outputs.changed }}" = true ]; then subject="Tested against new upstream versions: $RESULT"; else subject="New Obsidian beta ${{ needs.check.outputs.beta }}: to be tested locally"; RESULT=success; fi
          [ -n "${{ needs.check.outputs.beta }}" ] && list="$list"$'\n'"- Obsidian beta ${{ needs.check.outputs.beta }} (tested locally, .dev/beta-local.sh)"
          git commit -m "$subject" -m "$list"
          # The tests take a while and main may have moved meanwhile: put the
          # record on top of it, and say so in the issue either way.
          for _ in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          if [ "$RESULT" != "success" ]; then
            gh issue create --title "Tests fail against new upstream versions" \
              --body "$(printf 'The suites failed after these changed:\n\n%s\n\nRun: %s' "$list" "$RUN")"
          fi

  environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # environment-watch comes from development-template, a devDependency;
      # the environments themselves are listed in devkit.config.json.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(node node_modules/development-template/bin/environment-watch.mjs --diff)
          echo "$out" | jq .now > .github/environment-versions.json
          echo "$out" | jq -r '.changes[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$(echo "$out" | jq -r .changed)" >> "$GITHUB_OUTPUT"
          echo "targets=$(echo "$out" | jq -r '.targets | join(" ")')" >> "$GITHUB_OUTPUT"
          echo "main=$(echo "$out" | jq -r .mainTests)" >> "$GITHUB_OUTPUT"
          echo "$out" | jq -r '.changes | join("\n")' > /tmp/why.txt
      - name: Run the tests of what changed, and record it
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.diff.outputs.targets }}
          MAIN: ${{ steps.diff.outputs.main }}
        run: |
          why=$(cat /tmp/why.txt)
          suites="test-external test-links test-rename test-create test-drop test-urls test-html test-glob test-tab"
          all="test-blank test-additions test-create test-drop test-external test-glob test-tab test-urls test-html test-links test-rename test-gestures test-navlock test-keyleak test-compat test-compat-ui test-foldernote"
          for t in $TARGETS; do
            # A new Electron beta is a heads-up for every suite, not only the system ones.
            [ "$t" = electron-next ] && s="$all" || s="$suites"
            gh workflow run test-systems.yml --ref main -f target="$t" -f suites="$s" -f obsidian=latest -f why="$why"
          done
          [ "$MAIN" = true ] && gh workflow run test.yml --ref main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/environment-versions.json
          git commit -m "Test environments changed: ${TARGETS:-main suites}" -m "$why"
          for _ in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
