# Runs the test suites on GitHub's runners instead of a developer's machine:
# a suite drives a real Obsidian through its DevTools port, takes the focus,
# and runs for minutes — and here it gets a sandboxed Obsidian of its own
# (obsidian-launcher, see .dev/ci-run.sh) on a virtual display.
#
# Runs on every push to a branch, before every release (release.yml calls it),
# and on demand: Actions → Test → Run workflow, or `.dev/test-remote.sh`.
name: Test

on:
  push:
    branches: ["**"]
    # Documentation and translations cannot break a suite.
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run, space separated (empty: all), e.g. test-tab test-drop"
        default: ""
      filter:
        description: "Only the cases whose name contains this (passed to each suite)"
        default: ""
      obsidian:
        description: "Obsidian versions"
        type: choice
        options: [both, latest, earliest]
        default: both
      os:
        description: "Systems: Linux (Ubuntu); Windows Server 2025 (windows), Windows 11 on Arm (windows-arm), every Windows image incl. Server 2022 (windows-all); macOS 15 on Apple silicon (macos), and on Intel too (macos-all); both = Linux + Server 2025; all = every one"
        type: choice
        options: [linux, windows, windows-arm, windows-all, macos, macos-all, both, all]
        default: linux
  workflow_call:

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      versions: ${{ steps.plan.outputs.versions }}
      unit: ${{ steps.plan.outputs.unit }}
      linux: ${{ steps.plan.outputs.linux }}
      desktops: ${{ steps.plan.outputs.desktops }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          WANT_SUITES: ${{ inputs.suites }}
          WANT_VERSIONS: ${{ inputs.obsidian }}
          WANT_OS: ${{ inputs.os }}
        run: |
          # A suite needs Obsidian when it connects to one; the others only
          # bundle the sources and run in plain Node.
          all=$(ls .dev/test-*.mjs | xargs -n1 basename | sed 's/\.mjs$//')
          want=${WANT_SUITES:-$all}
          app=(); unit=()
          for s in $want; do
            [ -f ".dev/$s.mjs" ] || { echo "::error::no suite .dev/$s.mjs"; exit 1; }
            if grep -q 'connect()' ".dev/$s.mjs"; then app+=("$s"); else unit+=("$s"); fi
          done
          case "${WANT_VERSIONS:-both}" in
            latest) versions='["latest"]' ;;
            earliest) versions='["earliest"]' ;;
            *) versions='["earliest","latest"]' ;;
          esac
          echo "suites=$(printf '%s\n' "${app[@]}" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "unit=$(printf '%s\n' "${unit[@]}" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          # Pushes and release.yml pass no os: Linux only.
          # The runners besides Linux, which need no virtual display.
          win='"windows-2025","windows-2022","windows-11-arm"'
          mac='"macos-15","macos-15-intel"'
          case "${WANT_OS:-linux}" in
            linux) linux=true; desktops='[]' ;;
            windows) linux=false; desktops='["windows-2025"]' ;;
            windows-arm) linux=false; desktops='["windows-11-arm"]' ;;
            windows-all) linux=false; desktops="[$win]" ;;
            macos) linux=false; desktops='["macos-15"]' ;;
            macos-all) linux=false; desktops="[$mac]" ;;
            both) linux=true; desktops='["windows-2025"]' ;;
            all) linux=true; desktops="[$win,$mac]" ;;
            *) echo "::error::unknown os $WANT_OS"; exit 1 ;;
          esac
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "desktops=$desktops" >> "$GITHUB_OUTPUT"

  unit:
    needs: plan
    if: needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node ".dev/${{ matrix.suite }}.mjs"

  obsidian:
    needs: plan
    if: needs.plan.outputs.suites != '[]' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    name: ${{ matrix.suite }} (Obsidian ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build the plugin
        run: node esbuild.config.mjs production
      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: ~/.obsidian-cache
          key: obsidian-${{ matrix.version }}-${{ runner.os }}-${{ hashFiles('manifest.json') }}
          restore-keys: obsidian-${{ matrix.version }}-${{ runner.os }}-
      - name: Run ${{ matrix.suite }}
        env:
          OBSIDIAN_VERSION: ${{ matrix.version }}
          SUITE_FILTER: ${{ inputs.filter }}
          # Ubuntu's AppArmor keeps Electron's sandbox from starting on the
          # runner; the suites drive a throwaway vault, nothing to sandbox from.
          OBSIDIAN_EXTRA_ARGS: --no-sandbox
          LURE_SHOTS: shots
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" .dev/ci-run.sh "${{ matrix.suite }}"
          code=$?
          # 2: cases that could not be asked on this display (see Skipped in
          # .dev/harness.mjs) — not a failure, but not to be read as clean.
          if [ $code -eq 2 ]; then echo "::warning::${{ matrix.suite }} skipped cases it could not ask here"; exit 0; fi
          exit $code
      - name: Keep the pictures the colour cases take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-${{ matrix.suite }}-${{ matrix.version }}
          path: shots/look/
          if-no-files-found: ignore
      - name: Keep Obsidian's log and the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.suite }}-${{ matrix.version }}
          path: |
            obsidian-*.log
            shots/

  obsidian-desktop:
    needs: plan
    # On demand only: Windows and macOS runners are slower to start, and the
    # suites were written on Linux — this is where they learn what the other
    # systems do differently.
    # windows-11-arm runs the Arm64 build of Obsidian (the launcher picks the
    # installer for the runner's architecture).
    if: needs.plan.outputs.suites != '[]' && needs.plan.outputs.desktops != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        runner: ${{ fromJSON(needs.plan.outputs.desktops) }}
    name: ${{ matrix.suite }} (Obsidian ${{ matrix.version }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build the plugin
        run: node esbuild.config.mjs production
      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: ~/.obsidian-cache
          key: obsidian-${{ matrix.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifest.json') }}
          restore-keys: obsidian-${{ matrix.version }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Run ${{ matrix.suite }}
        shell: bash
        env:
          OBSIDIAN_VERSION: ${{ matrix.version }}
          SUITE_FILTER: ${{ inputs.filter }}
          LURE_SHOTS: shots
        run: |
          set +e
          # A desktop session is there already: no virtual display.
          .dev/ci-run.sh "${{ matrix.suite }}"
          code=$?
          if [ $code -eq 2 ]; then echo "::warning::${{ matrix.suite }} skipped cases it could not ask here"; exit 0; fi
          exit $code
      - name: Keep the pictures the colour cases take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-${{ matrix.suite }}-${{ matrix.version }}-${{ matrix.runner }}
          path: shots/look/
          if-no-files-found: ignore
      - name: Keep Obsidian's log and the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.suite }}-${{ matrix.version }}-${{ matrix.runner }}
          path: |
            obsidian-*.log
            shots/
